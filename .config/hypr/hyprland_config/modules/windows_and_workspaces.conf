windowrule {
    name = vscode-transparency
    match:class = ^(code)$|^(code-url-handler)$
    opacity = 0.9 0.9 override
}

windowrule {
    name = spotify-transparency
    match:class = ^(Spotify)$
    opacity = 0.9 0.9 override
}

windowrule {
    name = steam-transparency
    match:class = ^(steam)$
    opacity = 0.9 0.9 override
}

windowrule {
    name = discord-transparency
    match:class = ^(discord)$
    opacity = 0.9 0.9 override
}

windowrule {
    name = chrome-transparency
    match:class = ^(google-chrome)$|
    opacity = 0.92 0.92 override
}



